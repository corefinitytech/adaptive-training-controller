[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corefinity-adaptive"
version = "0.1.0.dev0"
description = "A vendor-neutral framework for closed-loop adaptive model training."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "CoreFinity" }]
keywords = [
  "machine-learning",
  "deep-learning",
  "adaptive-training",
  "curriculum-learning",
  "pytorch",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  # PyTorch stopped publishing macOS x86_64 (Intel) wheels after 2.2.2 (mid-2024); MPS
  # was never available on Intel Macs regardless. Everywhere else gets a current build.
  "torch>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch>=2.2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pydantic>=2.7",
  # torch 2.2.2 (Intel Mac only, see above) was built against NumPy's pre-2.0 ABI and
  # warns/can misbehave under NumPy 2.x; keep numpy<2 on that same platform branch.
  "numpy>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
jev = ["typesafe-sdk"]
mlflow = ["mlflow>=2.14"]
dashboard = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/corefinity/corefinity-adaptive"

[tool.hatch.build.targets.wheel]
packages = ["src/corefinity_adaptive"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["corefinity_adaptive"]

[tool.mypy]
# Set to 3.12, not the project's 3.11 floor: numpy's stubs use PEP 695 `type` syntax
# unconditionally, which mypy can only parse when targeting 3.12+. This governs mypy's
# own stub-parsing only — it doesn't relax `requires-python` or permit 3.12-only syntax
# in our own source, since none is used here.
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: end-to-end tests that exercise multiple components together",
]

[tool.coverage.run]
source = ["src/corefinity_adaptive"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
