name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: macos-latest
    environment: release
    permissions:
      id-token: write # trusted publishing to PyPI, no stored token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv build
      - name: Publish to PyPI
        run: uv publish
